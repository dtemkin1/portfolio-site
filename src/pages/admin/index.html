<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <title>Content Manager</title>
  </head>

  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      var WorkPreview = createClass({
        render: function () {
          var entry = this.props.entry;
          var title = entry.getIn(["data", "title"]);
          var img = entry.getIn(["data", "img"]);
          var imgAlt = entry.getIn(["data", "img_alt"]);
          var description = entry.getIn(["data", "description"]);
          var when = entry.getIn(["data", "when"]);
          var status = entry.getIn(["data", "status"]);
          var content = this.props.widgetFor("body");
          var tags = entry.getIn(["data", "tags"]);

          return h(
            "main",
            {},
            h(
              "header",
              {},
              h(
                "div",
                { className: "heading" },
                h("h1", {}, title),
                when ? h("p", {}, when) : null,
              ),
              status === "in-development"
                ? h("p", { className: "status" }, "In development")
                : null,
              h("p", {}, description),
              (tags ? tags.size > 0 : false)
                ? h("p", {}, tags.map((t) => t).join(", "))
                : null,
            ),
            img
              ? h("img", {
                  src: this.props.getAsset(img).toString(),
                  alt: imgAlt,
                })
              : null,
            h("div", { className: "prose" }, content),
          );
        },
      });
      CMS.registerPreviewTemplate("work", WorkPreview);
      CMS.registerPreviewStyle(
        "https://fonts.googleapis.com/css2?family=Doto:wght@900&family=Overpass:wght@500;800&family=Overpass+Mono&display=swap",
      );
      CMS.registerPreviewStyle(
        "*,::before,::after{box-sizing:border-box}body{margin:0;background:#003da5;color:#fff;font:500 1.125rem/1.55 Overpass,system-ui,sans-serif}main{max-width:62rem;margin-inline:auto;padding:1.5rem}header{padding:1.25rem;border-radius:6px;background:#17130b;color:#d6dbe5;font:1rem/1.55 'Overpass Mono',monospace}header p{margin:.5rem 0 0;max-width:72ch}.heading{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 1.5rem;color:#ffc72c;font:900 1.75rem/1.3 Doto,monospace}.heading h1{flex:1 1 16rem;margin:0;font:inherit}.heading p{margin:0;white-space:nowrap}.status{color:#ffc72c}img{display:block;width:100%;max-height:28rem;margin-top:1.5rem;border-radius:6px;object-fit:cover}.prose{max-width:65ch;margin-top:2rem}.prose a{color:#ffc72c}.prose blockquote{margin-inline:0;padding-inline-start:1rem;border-inline-start:4px solid #ffc72c}",
        { raw: true },
      );
    </script>
  </body>
</html>
