$schema: https://unpkg.com/@sveltia/cms@0.265.0/schema/sveltia-cms.json
backend:
  name: github
  repo: dtemkin1/portfolio-site
  branch: main
  squash_merges: true
publish_mode: editorial_workflow
media_folder: "src/assets/posts"
public_folder: "/src/assets/posts"
site_url: https://www.diegotemkin.com/
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
output:
  omit_empty_optional_fields: true
slug:
  encoding: "ascii"
  clean_accents: true
collections:
  - name: "work"
    label: "Work"
    description: "Projects on the board. A project gets its own page when it has content, an image, or publications."
    folder: "/src/content/work"
    media_folder: "/src/assets/posts"
    public_folder: "../../assets/posts"
    preview_path: "work/{{slug}}"
    slug: "{{slug}}"
    sortable_fields:
      - title
      - { field: "publishDate", label: "Publish Date", default_sort: "desc" }
    fields:
      - {
          label: "Title",
          name: "title",
          widget: "string",
          minlength: 1,
          maxlength: 60,
        }
      - {
          label: "Description",
          name: "description",
          widget: "text",
          minlength: 1,
          maxlength: 160,
          pattern: ['^[^\n]*$', "Keep it to one line"],
        }
      - {
          label: "Publish Date",
          name: "publishDate",
          widget: "datetime",
          type: "date",
        }
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        pattern: ["^[^,]+(,[^,]+)*$", "Remove any empty tags"]
      - label: "Content Preview"
        name: "img"
        widget: "object"
        required: false
        fields:
          - { label: "Image", name: "src", widget: "image" }
          - {
              label: "Alt text",
              name: "alt",
              widget: "text",
              minlength: 1,
              maxlength: 150,
              pattern: ['^[^\n]*$', "Keep it to one line"],
            }
      - { label: "Draft", name: "draft", widget: "boolean", required: false }
      - {
          label: "Earlier project",
          name: "earlier",
          widget: "boolean",
          required: false,
          hint: "Shows on All stops, but not on the home board.",
        }
      - { label: "Now", name: "now", widget: "boolean", required: false }
      - {
          label: "In development",
          name: "inDevelopment",
          widget: "boolean",
          required: false,
        }
      - label: "Publications"
        name: "publications"
        widget: "list"
        required: false
        hint: "BibTeX keys of works on ORCID, like cong2024nbs."
        pattern:
          ['^[^\s,]+(,[^\s,]+)*$', "Each key needs a value, with no spaces"]
      - label: "Links"
        name: "links"
        widget: "list"
        required: false
        summary: "{{label}}"
        fields:
          - { label: "Label", name: "label", widget: "string" }
          - {
              label: "Link",
              name: "url",
              widget: "string",
              type: "url",
              pattern:
                [
                  '^https?://\S+$',
                  "Must be a full link, starting with https://",
                ],
            }
      - { label: "Content", name: "body", widget: "richtext", required: false }
  - name: "notes"
    label: "Notes"
    label_singular: "Note"
    folder: "/src/content/notes"
    extension: "yml"
    slug: "{{slug}}"
    summary: "{{title}} ({{source}})"
    sortable_fields:
      - title
      - { field: "date", label: "Date", default_sort: "desc" }
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Source", name: "source", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", type: "date" }
      - {
          label: "Link",
          name: "url",
          widget: "string",
          type: "url",
          pattern:
            ['^https?://\S+$', "Must be a full link, starting with https://"],
        }
      - { label: "Note", name: "note", widget: "string", required: false }
      - {
          label: "Project",
          name: "project",
          widget: "relation",
          collection: "work",
          required: false,
        }
      - {
          label: "Current",
          name: "current",
          widget: "boolean",
          required: false,
          hint: "Turn on for recent news.",
        }
