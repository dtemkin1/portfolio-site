backend:
  name: github
  repo: dtemkin1/portfolio-site
  branch: main # Branch to update (optional; defaults to master)
  squash_merges: true
publish_mode: editorial_workflow
media_folder: "src/assets/posts" # Media files will be stored in the repo under src/assets/posts
public_folder: "../../assets/posts"
site_url: https://www.diegotemkin.com/
media_processing:
  enabled: true
  strip_metadata: true
slug:
  encoding: "ascii"
  clean_accents: true
collections:
  - name: "work"
    label: "Work"
    description: "Projects on the board. A project gets its own page when it has content, an image, or publications."
    folder: "/src/content/work"
    preview_path: "work/{{slug}}"
    create: true
    slug: "{{slug}}"
    sortable_fields:
      - title
      - { field: "publishDate", label: "Publish Date", default_sort: "desc" }
    fields:
      - {
          label: "Title",
          name: "title",
          widget: "string",
          pattern:
            ['^(?=[\S\s]{0,60}$)[\S\s]*', "Must have at most 60 characters"],
        }
      - {
          label: "Description",
          name: "description",
          widget: "string",
          pattern:
            ['^(?=[\S\s]{0,160}$)[\S\s]*', "Must have at most 160 characters"],
        }
      - {
          label: "Publish Date",
          name: "publishDate",
          widget: "datetime",
          date_format: "YYYY-MM-DD",
          time_format: false,
          picker_utc: true,
        }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - {
          label: "Content Preview",
          name: "img",
          widget: "image",
          required: false,
        }
      - {
          label: "Image Alt",
          name: "img_alt",
          widget: "string",
          required: false,
          hint: "Required when there's a Content Preview image.",
        }
      - { label: "Draft", name: "draft", widget: "boolean", required: false }
      - {
          label: "Earlier project",
          name: "earlier",
          widget: "boolean",
          required: false,
          hint: "Shows on All stops, but not on the home board.",
        }
      - { label: "Board Time", name: "when", widget: "string", required: false }
      - {
          label: "Status",
          name: "status",
          widget: "select",
          options: ["in-development"],
          required: false,
        }
      - {
          label: "Publications",
          name: "publications",
          widget: "list",
          required: false,
          hint: "BibTeX keys of works on ORCID, like cong2024nbs.",
        }
      - { label: "Content", name: "body", widget: "richtext", required: false }
  - name: "notes"
    label: "Notes"
    label_singular: "Note"
    folder: "/src/content/notes"
    extension: "yml"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} ({{source}})"
    sortable_fields:
      - title
      - { field: "date", label: "Date", default_sort: "desc" }
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Source", name: "source", widget: "string" }
      - {
          label: "Date",
          name: "date",
          widget: "datetime",
          date_format: "YYYY-MM-DD",
          time_format: false,
          picker_utc: true,
        }
      - {
          label: "Link",
          name: "url",
          widget: "string",
          pattern:
            ['^https?://\S+$', "Must be a full link, starting with https://"],
        }
      - { label: "Note", name: "note", widget: "string", required: false }
      - {
          label: "Project",
          name: "project",
          widget: "relation",
          collection: "work",
          value_field: "{{slug}}",
          search_fields: ["title"],
          display_fields: ["title"],
          required: false,
        }
      - {
          label: "Current",
          name: "current",
          widget: "boolean",
          required: false,
          hint: "Enable if recent, will add to homepage.",
        }
